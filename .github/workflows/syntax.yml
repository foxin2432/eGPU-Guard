name: syntax

# The scripts must parse on both the in-box Windows PowerShell 5.1 and PowerShell 7+.
# This is not theoretical: a duplicated `default` clause in a switch statement once shipped
# into eGPU-Watch.ps1 and only a parse check caught it.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every script with PowerShell 5.1
        shell: powershell
        run: |
          $failed = 0
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed++
              Write-Host "FAIL $($_.Name)"
              $errors | ForEach-Object {
                Write-Host "  L$($_.Extent.StartLineNumber): $($_.Message)"
              }
            } else {
              Write-Host "OK   $($_.Name)"
            }
          }
          if ($failed -gt 0) { throw "$failed script(s) failed to parse" }

      - name: Parse every script with PowerShell 7
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed++
              Write-Host "FAIL $($_.Name)"
              $errors | ForEach-Object {
                Write-Host "  L$($_.Extent.StartLineNumber): $($_.Message)"
              }
            } else {
              Write-Host "OK   $($_.Name)"
            }
          }
          if ($failed -gt 0) { throw "$failed script(s) failed to parse" }

      - name: Enforce the pure-ASCII rule
        shell: pwsh
        run: |
          # Localised text is built from code points on purpose: writing a non-ASCII literal
          # into these files has corrupted them (mojibake ate a quote and broke parsing).
          $bad = 0
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $offenders = @(Select-String -Path $_.FullName -Pattern '[^\x00-\x7F]')
            if ($offenders.Count -gt 0) {
              $bad++
              Write-Host "FAIL $($_.Name) has $($offenders.Count) non-ASCII line(s)"
              $offenders | Select-Object -First 5 | ForEach-Object {
                Write-Host "  L$($_.LineNumber): $($_.Line)"
              }
            }
          }
          if ($bad -gt 0) { throw "$bad script(s) are not pure ASCII" }
          Write-Host 'all scripts are pure ASCII'
