name: syntax

# The scripts must parse on both the in-box Windows PowerShell 5.1 and PowerShell 7+.
# This is not theoretical: a duplicated `default` clause in a switch statement once shipped
# into eGPU-Watch.ps1 and only a parse check caught it.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every script with PowerShell 5.1
        shell: powershell
        run: |
          $failed = 0
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed++
              Write-Host "FAIL $($_.Name)"
              $errors | ForEach-Object {
                Write-Host "  L$($_.Extent.StartLineNumber): $($_.Message)"
              }
            } else {
              Write-Host "OK   $($_.Name)"
            }
          }
          if ($failed -gt 0) { throw "$failed script(s) failed to parse" }

      - name: Parse every script with PowerShell 7
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed++
              Write-Host "FAIL $($_.Name)"
              $errors | ForEach-Object {
                Write-Host "  L$($_.Extent.StartLineNumber): $($_.Message)"
              }
            } else {
              Write-Host "OK   $($_.Name)"
            }
          }
          if ($failed -gt 0) { throw "$failed script(s) failed to parse" }

      - name: Enforce the pure-ASCII rule
        shell: pwsh
        run: |
          # Localised text is built from code points on purpose: writing a non-ASCII literal
          # into these files has corrupted them (mojibake ate a quote and broke parsing).
          $bad = 0
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $offenders = @(Select-String -Path $_.FullName -Pattern '[^\x00-\x7F]')
            if ($offenders.Count -gt 0) {
              $bad++
              Write-Host "FAIL $($_.Name) has $($offenders.Count) non-ASCII line(s)"
              $offenders | Select-Object -First 5 | ForEach-Object {
                Write-Host "  L$($_.LineNumber): $($_.Line)"
              }
            }
          }
          if ($bad -gt 0) { throw "$bad script(s) are not pure ASCII" }
          Write-Host 'all scripts are pure ASCII'

      - name: Validate the shipped settings file
        shell: powershell
        run: |
          # A broken eGPU-Guard.config.psd1 is only noticed at runtime, on a user's machine, so
          # check it here with the same loader the scripts use: it must parse, pass every
          # validation rule, and survive a save/reload round trip unchanged.
          . .\eGPU-Config.ps1
          $path = Join-Path (Get-Location) 'eGPU-Guard.config.psd1'
          if (-not (Test-Path -LiteralPath $path)) { throw 'eGPU-Guard.config.psd1 is missing' }
          $cfg = Get-GuardConfig -Path $path
          $problems = @(Test-GuardConfig -Config $cfg)
          if ($problems.Count -gt 0) {
            $problems | ForEach-Object { Write-Host "FAIL $_" }
            throw "$($problems.Count) invalid setting(s) in the shipped config"
          }
          $text = ConvertTo-GuardConfigText -Config $cfg
          $shipped = [IO.File]::ReadAllText($path, [Text.Encoding]::UTF8)
          # Compare with newlines normalised: git may check the file out with LF depending on
          # core.autocrlf, and that must not read as "the file needs reformatting".
          $norm = { param($s) ($s -replace "`r`n", "`n") }
          if ((& $norm $text) -ne (& $norm $shipped)) {
            throw 'the shipped config is not what the writer produces - a Settings save would reformat it'
          }
          Write-Host "config OK: $($cfg.DisableTime) / $($cfg.NotifyTime) / $($cfg.Days -join ',')"
